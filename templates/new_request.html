{% extends "base.html" %}{% block content %}<div class="top"><div><div class="title">تسجيل طلب جديد</div><div class="sub">السيريال يولده النظام تلقائيًا</div></div></div><form class="form" method="post"><div class="row"><div class="field"><label>رقم الطلب</label><input name="request_no" required></div><div class="field"><label>نوع الطلب</label><input name="request_type" placeholder="اكتب نوع الطلب" required></div><div class="field"><label>مرجع الطلب</label><select name="reference" required>{% for x in references %}<option>{{x}}</option>{% endfor %}</select></div><div class="field"><label>المدينة</label><select name="city" required>{% for x in cities %}<option>{{x}}</option>{% endfor %}</select></div><div class="field"><label>السجل التجاري</label><select name="company_id" required><option value="">اختر السجل</option>{% for x in companies %}<option value="{{x.id}}">{{x.cr}} — {{x.name}}</option>{% endfor %}</select></div></div><button class="btn">تسجيل الطلب</button></form>{% endblock %}
