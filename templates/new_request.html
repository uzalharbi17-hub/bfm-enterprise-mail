{% extends "base.html" %}
{% block content %}
<div class="top">
  <div>
    <div class="title">تسجيل طلب جديد</div>
    <div class="sub">السيريال يولده النظام تلقائيًا</div>
  </div>
</div>

<form class="form" method="post" id="newRequestForm">
  <div class="row">
    <div class="field">
      <label>رقم الطلب</label>
      <input name="request_no" required>
    </div>

    <div class="field">
      <label>نوع الطلب</label>
      <input name="request_type" placeholder="اكتب نوع الطلب" required>
    </div>

    <div class="field">
      <label>مرجع الطلب</label>
      <select name="reference" required>
        {% for x in references %}<option value="{{ x }}">{{ x }}</option>{% endfor %}
      </select>
    </div>

    <div class="field">
      <label>المدينة</label>
      <select name="city" required>
        {% for x in cities %}<option value="{{ x }}">{{ x }}</option>{% endfor %}
      </select>
    </div>

    <div class="field" style="min-width:280px">
      <label>رقم السجل التجاري</label>
      <input id="companySearch" name="company_cr" list="companyOptions" autocomplete="off" inputmode="numeric" placeholder="اكتب رقم السجل التجاري..." required>
      <input type="hidden" name="company_id" id="companyId">
      <datalist id="companyOptions">
        {% for x in companies %}
          <option value="{{ x.cr }}" data-id="{{ x.id }}" data-name="{{ x.name }}" data-unified="{{ x.unified }}"></option>
        {% endfor %}
      </datalist>
      <div class="row" style="margin-top:12px">
        <div class="field">
          <label>اسم المنشأة</label>
          <input id="companyName" readonly placeholder="يظهر تلقائيًا">
        </div>
        <div class="field">
          <label>رقم المنشأة</label>
          <input id="companyUnified" readonly placeholder="يظهر تلقائيًا">
        </div>
      </div>
      <small style="display:block;margin-top:6px;opacity:.7">اكتب جزءًا من رقم السجل مثل 700 وستظهر السجلات المطابقة، ثم اختر السجل.</small>
    </div>
  </div>

  <button class="btn" type="submit">تسجيل الطلب</button>
</form>

<script>
(function () {
  const input = document.getElementById('companySearch');
  const hidden = document.getElementById('companyId');
  const nameInput = document.getElementById('companyName');
  const unifiedInput = document.getElementById('companyUnified');
  const options = Array.from(document.querySelectorAll('#companyOptions option'));
  const form = document.getElementById('newRequestForm');

  function syncCompany() {
    const value = input.value.trim();
    const match = options.find(o => o.value === value);
    hidden.value = match ? match.dataset.id : '';
    nameInput.value = match ? (match.dataset.name || '') : '';
    unifiedInput.value = match ? (match.dataset.unified || '') : '';
  }

  input.addEventListener('input', syncCompany);
  input.addEventListener('change', syncCompany);

  form.addEventListener('submit', function (e) {
    syncCompany();
    if (!hidden.value) {
      e.preventDefault();
      alert('اختر رقم السجل التجاري من القائمة حتى يظهر اسم المنشأة ورقم المنشأة تلقائيًا.');
      input.focus();
    }
  });
})();
</script>
{% endblock %}
