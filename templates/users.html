{% extends "base.html" %}{% block content %}<div class="top"><div><div class="title">المستخدمون</div></div></div><form class="form" method="post"><div class="row"><div class="field"><label>الاسم</label><input name="name" required></div><div class="field"><label>اسم المستخدم</label><input name="username" required></div><div class="field"><label>كلمة المرور</label><input name="password" required></div><div class="field"><label>البريد الإلكتروني</label><input name="email" type="email"></div><div class="field"><label>الصلاحية</label><select name="role"><option value="employee">موظف</option><option value="manager">مدير</option><option value="super_admin">Super Admin</option></select></div></div><button class="btn">إضافة مستخدم</button></form><div class="card" style="margin-top:20px"><table class="table"><tr><th>الاسم</th><th>اسم المستخدم</th><th>البريد</th><th>الصلاحية</th></tr>{% for x in rows %}<tr><td>{{x.name}}</td><td>{{x.username}}</td><td>{{x.email}}</td><td>{{x.role}}</td></tr>{% endfor %}</table></div>{% endblock %}
