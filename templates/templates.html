{% extends "base.html" %}{% block content %}<div class="title">قوالب الإيميلات</div><p class="sub">يمكن تعديل النصوص، واستخدام: {{request_no}} {{user}} {{date}} {{note}} {{manager}}</p>{% for x in rows %}<form class="form" method="post" style="margin-top:18px"><input type="hidden" name="code" value="{{x.code}}"><div class="field"><label>الموضوع</label><input name="subject" value="{{x.subject}}"></div><div class="field"><label>نص الرسالة</label><textarea name="body">{{x.body}}</textarea></div><button class="btn">حفظ القالب</button></form>{% endfor %}{% endblock %}
