<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><title>تسجيل الدخول</title></head><body class="login"><div class="loginbox"><h1>نظام متابعة الطلبات</h1><p class="sub">تسجيل الدخول للنظام</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="alert">{{msg}}</div>{% endfor %}{% endwith %}<form method="post"><div class="field"><label>اسم المستخدم</label><input name="username" required></div><div class="field"><label>كلمة المرور</label><input name="password" type="password" required></div><button class="btn" style="width:100%">دخول</button></form></div></body></html>
