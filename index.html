<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090c"><link rel="manifest" href="manifest.json"><title>بلوت | الحاسبة</title><style>
*{box-sizing:border-box}body{margin:0;background:#08090c;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:18px 14px 35px}.hide{display:none!important}.brand{text-align:center;padding:15px}.brand .ico{font-size:42px}.brand h1{margin:4px;font-size:29px}.muted{color:#9ca3af;font-size:13px}.card{background:#12151a;border:1px solid #252a32;border-radius:22px;padding:17px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:8px 0}.field label{display:block;color:#b8bec8;font-size:12px;margin-bottom:6px}input{width:100%;padding:13px;border:1px solid #303640;background:#0b0d10;border-radius:13px;color:#fff;font-size:16px}.btn{width:100%;border:0;border-radius:14px;padding:14px;margin-top:9px;background:#272d36;color:white;font-weight:800;font-size:15px}.primary{background:#f5f5f5;color:#08090c}.gold{background:#705a25}.danger{background:#51242b}.center{text-align:center}.badge{display:inline-block;background:#252b34;border-radius:99px;padding:8px 12px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.playing{height:75px;background:#fafafa;color:#111;border-radius:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:23px;font-weight:900}.playing small{font-size:9px}.scores{display:grid;grid-template-columns:1fr 1fr;gap:10px}.team{background:#0b0d10;border:1px solid #20252d;border-radius:18px;padding:13px;text-align:center}.team b{display:block;min-height:22px}.points{font-size:54px;font-weight:900}.round{background:#0b0d10;border-radius:14px;padding:10px;margin:8px 0;display:flex;justify-content:space-between}.winner{font-size:25px;font-weight:900}.final{font-size:65px;font-weight:900}canvas{width:100%;border-radius:18px;margin-top:10px}footer{text-align:center;color:#626a75;font-size:10px;margin-top:22px}
</style></head><body><main class="app">
<section id="setup"><div class="brand"><div class="ico">🃏</div><h1>بلوت</h1><div class="muted">حاسبة البلوت المجانية</div></div>
<div class="card"><h3>اللاعبون</h3><div class="grid"><div class="field"><label>اللاعب 1</label><input id="p1" placeholder="عبد الرحمن"></div><div class="field"><label>اللاعب 2</label><input id="p2" placeholder="علي"></div><div class="field"><label>اللاعب 3</label><input id="p3" placeholder="خالد"></div><div class="field"><label>اللاعب 4</label><input id="p4" placeholder="محمد"></div></div></div>
<div class="card"><h3>الفرق</h3><div class="field"><label>الفريق الأول</label><input id="t1" placeholder="الفريق الأول"></div><div class="field"><label>الفريق الثاني</label><input id="t2" placeholder="الفريق الثاني"></div></div>
<button class="btn primary" onclick="start()">ابدأ الجلسة</button></section>
<section id="game" class="hide"><div class="brand"><div class="ico">♠️</div><h1>جلسة البلوت</h1><div id="date" class="muted"></div></div>
<div class="card center"><span id="dealer" class="badge">لم يتم تحديد الموزع</span><div id="cards" class="cards"></div><button class="btn gold" onclick="deal()">🃏 قرعة وتحديد الموزع</button></div>
<div class="card"><div class="scores"><div class="team"><b id="team1"></b><div id="s1" class="points">0</div><div class="grid"><button class="btn" onclick="add(0,1)">+1</button><button class="btn" onclick="add(0,10)">+10</button></div></div><div class="team"><b id="team2"></b><div id="s2" class="points">0</div><div class="grid"><button class="btn" onclick="add(1,1)">+1</button><button class="btn" onclick="add(1,10)">+10</button></div></div></div><button class="btn" onclick="speak()">🔊 نطق النتيجة</button><button class="btn danger" onclick="finish()">إنهاء الصكة</button></div>
<div class="card"><h3>سجل النقاط</h3><div id="log" class="muted">لم تسجل نقاط بعد.</div></div></section>
<section id="finish" class="hide"><div class="brand"><div class="ico">🏆</div><h1>انتهت الصكة</h1></div><div class="card center"><div id="winner" class="winner"></div><div id="final" class="final"></div><div id="fdate" class="muted"></div><canvas id="canvas" width="1080" height="1350"></canvas><button class="btn primary" onclick="share()">📤 مشاركة صورة النتيجة</button><button class="btn" onclick="location.reload()">جلسة جديدة</button></div></section>
<footer>بلوت • مجاني • مصمم للآيفون</footer></main>
<script>
let P=[],T=[],S=[0,0],E=[],D="",DATE="";const $=id=>document.getElementById(id),deck=["7♠","8♠","9♠","10♠","J♠","Q♠","K♠","A♠","7♥","8♥","9♥","10♥","J♥","Q♥","K♥","A♥","7♦","8♦","9♦","10♦","J♦","Q♦","K♦","A♦","7♣","8♣","9♣","10♣","J♣","Q♣","K♣","A♣"],value=c=>parseInt(c)||({J:11,Q:12,K:13,A:14}[c[0]]||0);
function say(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="ar-SA";u.rate=.88;speechSynthesis.speak(u)}
function start(){P=[1,2,3,4].map(i=>$("p"+i).value.trim()||"لاعب "+i);T=[$("t1").value.trim()||"الفريق الأول",$("t2").value.trim()||"الفريق الثاني"];S=[0,0];E=[];DATE=new Intl.DateTimeFormat("ar-SA-u-ca-gregory",{year:"numeric",month:"long",day:"numeric"}).format(new Date());$("team1").textContent=T[0];$("team2").textContent=T[1];$("date").textContent=DATE;$("setup").classList.add("hide");$("game").classList.remove("hide");update();deal()}
function deal(){let pool=[...deck],d=P.map(p=>{let i=Math.floor(Math.random()*pool.length);return{p,c:pool.splice(i,1)[0]}}),h=d.reduce((a,b)=>value(b.c)>value(a.c)?b:a);D=h.p;$("dealer").textContent="التوزيع عند "+D;$("cards").innerHTML=d.map(x=>'<div class="playing">'+x.c+'<small>'+x.p+'</small></div>').join("");say("التوزيع عند "+D)}
function add(team,n){S[team]+=n;E.unshift({team:T[team],n,total:[...S]});update();speak()}
function update(){$("s1").textContent=S[0];$("s2").textContent=S[1];$("log").innerHTML=E.length?E.slice(0,12).map(e=>'<div class="round"><span>'+e.team+' +'+e.n+'</span><b>'+e.total[0]+' - '+e.total[1]+'</b></div>').join(""):"لم تسجل نقاط بعد."}
function speak(){say(S[0]+" لـ "+T[0]+"، و "+S[1]+" لـ "+T[1])}
function finish(){let i=S[0]>=S[1]?0:1,w=T[i];$("game").classList.add("hide");$("finish").classList.remove("hide");$("winner").textContent=w+" فاز";$("final").textContent=S[0]+" - "+S[1];$("fdate").textContent=DATE;draw(w);say("انتهت الصكة. "+w+" فاز، والنتيجة "+S[0]+" مقابل "+S[1])}
function draw(w){let c=$("canvas"),x=c.getContext("2d");x.fillStyle="#090b0f";x.fillRect(0,0,1080,1350);x.textAlign="center";x.fillStyle="#fff";x.font="bold 80px Arial";x.fillText("♠ بلوت",540,190);x.font="bold 85px Arial";x.fillText("نتيجة الصكة",540,380);x.font="bold 72px Arial";x.fillText(w,540,580);x.font="bold 170px Arial";x.fillText(S[0]+" - "+S[1],540,820);x.fillStyle="#b7bec9";x.font="42px Arial";x.fillText(DATE,540,990);x.font="36px Arial";x.fillText(T[0]+"  •  "+S[0]+"     |     "+T[1]+"  •  "+S[1],540,1110);x.font="30px Arial";x.fillText("حاسبة بلوت",540,1220)}
async function share(){$("canvas").toBlob(async b=>{let f=new File([b],"baloot-result.png",{type:"image/png"});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({title:"نتيجة البلوت",files:[f]});else{let a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="baloot-result.png";a.click()}},"image/png")}
</script></body></html>
